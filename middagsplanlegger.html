const HEADERS = { "Content-Type": "application/json", "apikey": SB_KEY, "Authorization": `Bearer ${SB_KEY}`, "Prefer": "return=representation" };

async function sbGet(table, params = "") {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${params}`, { headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table, body) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: "POST", headers: { ...HEADERS, "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbDelete(table, params) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}${params}`, { method: "DELETE", headers: HEADERS });
  if (!r.ok) throw new Error(await r.text());
}

  { id:2,  name:"Potet- og purreløksuppe", url:"https://www.bama.no/oppskrifter/supper/potet-og-purreloksuppe", tags:["suppe","vegetar"], rating:0 },

  { id:7,  name:"Fiskesuppe med reker", url:"https://www.godfisk.no/oppskrifter/torsk/fiskesuppe-med-reker/", tags:["fisk","suppe"], rating:0 },

  { id:12, name:"Høstgryte med eple og purre", url:"https://www.frukt.no/oppskrifter/hostgryte-med-eple-og-purre/", tags:["vegetar"], rating:0 },
  { id:13, name:"Wok med gulrot og nudler", url:"https://www.frukt.no/oppskrifter/wok-med-gulrot/", tags:["vegetar"], rating:0 },
  { id:14, name:"Torsk med ertepuré og soyasmør", url:"https://www.frukt.no/oppskrifter/torsk-med-ertepure-og-soyasmor/", tags:["fisk"], rating:0 },

const inputStyle = {

  fontSize:14, fontFamily:"Georgia,serif", background:"#faf6f0", color:"#2c1a0e", width:"100%",

// ── ISO week helpers ─────────────────────────────────────────────
function getISOWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const y = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - y) / 86400000) + 1) / 7);
}
function getISOYear(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  return d.getUTCFullYear();
}

// ── Sub-components ───────────────────────────────────────────────
function Spinner() {
  return <div style={{width:18,height:18,border:"3px solid #e0d4c0",borderTopColor:"#5c3317",borderRadius:"50%",animation:"spin 0.8s linear infinite",display:"inline-block"}} />;
}

function StarRating({ rating=0, onChange, size=20, readonly=false }) {
  const [hovered, setHovered] = useState(0);
  return (
    <div style={{display:"flex",gap:2,alignItems:"center"}}>
      {[1,2,3,4,5].map(star => {
        const filled = star <= (hovered || rating);
        return (
          <span key={star}
            onClick={readonly ? undefined : (e) => { e.stopPropagation(); onChange(star===rating?0:star); }}
            onMouseEnter={readonly ? undefined : ()=>setHovered(star)}
            onMouseLeave={readonly ? undefined : ()=>setHovered(0)}
            style={{fontSize:size,cursor:readonly?"default":"pointer",color:filled?"#e8a030":"#d4c4a8",transition:"color 0.1s,transform 0.1s",transform:(!readonly&&hovered===star)?"scale(1.2)":"scale(1)",display:"inline-block",lineHeight:1,userSelect:"none"}}>★</span>
        );
      })}
    </div>
  );
}

function TagBadges({ tags, size="normal" }) {
  return (
    <>
      {(tags||[]).map(tid => {
        const cat = CATEGORIES.find(c=>c.id===tid);
        return cat ? (
          <span key={tid} style={{background:cat.color,color:cat.text,borderRadius:10,padding:size==="small"?"1px 7px":"3px 10px",fontSize:size==="small"?10:12,fontFamily:"sans-serif",fontWeight:600}}>{cat.emoji} {cat.label}</span>
        ) : null;
      })}
    </>
  );
}

// ── Main App ─────────────────────────────────────────────────────
function App() {
  const [loading,       setLoading]       = useState(true);
  const [recipes,       setRecipes]       = useState([]);
  const [plan,          setPlan]          = useState(EMPTY_PLAN);
  const [history,       setHistory]       = useState({});
  const [view,          setView]          = useState("plan");
  const [showAddRecipe, setShowAddRecipe] = useState(false);
  const [showAssign,    setShowAssign]    = useState(null);
  const [newRecipe,     setNewRecipe]     = useState({name:"",url:"",tags:[]});
  const [ingredients,   setIngredients]   = useState({});
  const [loadingIngr,   setLoadingIngr]   = useState(null);
  const [searchQuery,   setSearchQuery]   = useState("");
  const [starFilter,    setStarFilter]    = useState(0);
  const [tagFilter,     setTagFilter]     = useState([]);
  const [notification,  setNotification]  = useState(null);
  const [expandedYear,  setExpandedYear]  = useState(null);
  const [syncing,       setSyncing]       = useState(false);

  const today       = new Date();
  const currentWeek = getISOWeek(today);
  const currentYear = getISOYear(today);

  const notify = (msg, type="ok") => {
    setNotification({msg,type});
    setTimeout(()=>setNotification(null), 3000);
  };

  // ── Load all data from Supabase on mount ──
  useEffect(()=>{
    (async()=>{
      try {
        // Load recipes
        const recs = await sbGet("recipes","?order=id");
        if (recs.length > 0) {
          setRecipes(recs);
        } else {
          // First run: seed with initial recipes
          await sbUpsert("recipes", INITIAL_RECIPES);
          setRecipes(INITIAL_RECIPES);
        }
        // Load plan
        const planRows = await sbGet("plan","");
        const planObj = Object.fromEntries(DAYS.map(d=>[d,null]));
        planRows.forEach(row=>{ planObj[row.day] = row.recipe; });
        setPlan(planObj);
        // Load history
        const histRows = await sbGet("history","?order=year.desc,week.desc");
        const histObj = {};
        histRows.forEach(row=>{
          const yr = String(row.year);
          if (!histObj[yr]) histObj[yr]={};
          histObj[yr][row.key] = { week:row.week, year:row.year, plan:row.plan, archivedAt:row.archived_at };
        });
        setHistory(histObj);
      } catch(e) {
        notify("Feil ved lasting fra Supabase: " + e.message, "warn");
      }
      setLoading(false);
    })();
  }, []);

  // ── Recipe operations ──
  const addRecipe = async () => {
    if (!newRecipe.name.trim()) return;
    const r = { id: Date.now(), name:newRecipe.name.trim(), url:newRecipe.url.trim(), tags:newRecipe.tags, rating:0 };
    setSyncing(true);
    try {
      await sbUpsert("recipes", [r]);
      setRecipes(prev=>[...prev, r]);
      setNewRecipe({name:"",url:"",tags:[]});
      setShowAddRecipe(false);
      notify("Oppskrift lagt til!");
    } catch(e) { notify("Feil: "+e.message,"warn"); }
    setSyncing(false);
  };

  const deleteRecipe = async (id) => {
    setSyncing(true);
    try {
      await sbDelete("recipes", `?id=eq.${id}`);
      setRecipes(prev=>prev.filter(r=>r.id!==id));
      // Clear from plan if assigned
      const updatedDays = DAYS.filter(d=>plan[d]?.id===id);
      for (const day of updatedDays) {
        await sbUpsert("plan", [{day, recipe:null}]);
      }
      setPlan(prev=>{ const n={...prev}; updatedDays.forEach(d=>n[d]=null); return n; });
      notify("Oppskrift slettet","warn");
    } catch(e) { notify("Feil: "+e.message,"warn"); }
    setSyncing(false);
  };

  const rateRecipe = async (id, rating) => {
    setRecipes(prev=>prev.map(r=>r.id===id?{...r,rating}:r));
    // Update in plan snapshot too
    setPlan(prev=>{ const n={...prev}; Object.keys(n).forEach(d=>{if(n[d]?.id===id)n[d]={...n[d],rating};}); return n; });
    try {
      await sbUpsert("recipes", [{...recipes.find(r=>r.id===id), rating}]);
      // Update plan rows that contain this recipe
      const days = DAYS.filter(d=>plan[d]?.id===id);
      for (const day of days) {
        await sbUpsert("plan",[{day, recipe:{...plan[day],rating}}]);
      }
    } catch(e) { notify("Feil ved lagring av vurdering","warn"); }
  };

  const toggleTag = async (recipeId, tagId) => {
    const recipe = recipes.find(r=>r.id===recipeId);
    if (!recipe) return;
    const tags = (recipe.tags||[]).includes(tagId)
      ? (recipe.tags||[]).filter(t=>t!==tagId)
      : [...(recipe.tags||[]), tagId];
    const updated = {...recipe, tags};
    setRecipes(prev=>prev.map(r=>r.id===recipeId?updated:r));
    setPlan(prev=>{ const n={...prev}; Object.keys(n).forEach(d=>{if(n[d]?.id===recipeId)n[d]={...n[d],tags};}); return n; });
    try {
      await sbUpsert("recipes",[updated]);
      const days = DAYS.filter(d=>plan[d]?.id===recipeId);
      for (const day of days) await sbUpsert("plan",[{day,recipe:{...plan[day],tags}}]);
    } catch(e) { notify("Feil ved lagring av tag","warn"); }
  };

  // ── Plan operations ──
  const assignRecipe = async (day, recipe) => {
    setPlan(prev=>({...prev,[day]:recipe}));
    setShowAssign(null);
    try { await sbUpsert("plan",[{day, recipe}]); }
    catch(e) { notify("Feil ved lagring av plan","warn"); }
  };

  const clearDay = async (day) => {
    setPlan(prev=>({...prev,[day]:null}));
    try { await sbUpsert("plan",[{day, recipe:null}]); }
    catch(e) { notify("Feil ved sletting av dag","warn"); }
  };

  // ── History operations ──
  const archiveWeek = async (week, year, planSnapshot) => {
    const key = `${year}-W${String(week).padStart(2,"0")}`;
    const entry = { key, week, year, plan:planSnapshot, archived_at:new Date().toISOString() };
    setSyncing(true);
    try {
      await sbUpsert("history",[entry]);
      setHistory(prev=>({...prev,[String(year)]:{...(prev[String(year)]||{}),[key]:{week,year,plan:planSnapshot,archivedAt:entry.archived_at}}}));
      notify(`Uke ${week} (${year}) arkivert!`);
    } catch(e) { notify("Feil ved arkivering: "+e.message,"warn"); }
    setSyncing(false);
  };

  const deleteHistoryEntry = async (year, key) => {
    try {
      await sbDelete("history",`?key=eq.${encodeURIComponent(key)}`);
      setHistory(prev=>{ const y={...(prev[String(year)]||{})}; delete y[key]; return {...prev,[String(year)]:y}; });
      notify("Arkivoppføring slettet","warn");
    } catch(e) { notify("Feil: "+e.message,"warn"); }
  };

  // ── Ingredients (AI) ──
  const fetchIngredients = async (recipeId, url) => {
    if (ingredients[recipeId]) return;
    setLoadingIngr(recipeId);
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,messages:[{role:"user",content:`Ingredienser for: ${url}\nSvar KUN med JSON:\n{"ingredients":["200g spagetti"]}\nNorsk med mengde. Maks 12.`}]})
      });
      const data = await response.json();
      const text = data.content.map(i=>i.text||"").join("");
      const parsed = JSON.parse(text.replace(/```json|```/g,"").trim());
      setIngredients(prev=>({...prev,[recipeId]:parsed.ingredients||[]}));
    } catch(e) {
      setIngredients(prev=>({...prev,[recipeId]:["Kunne ikke hente ingredienser automatisk"]}));
    }
    setLoadingIngr(null);
  };

  const allPlannedRecipes = Object.values(plan).filter(Boolean);

  const buildOdaSearch = () => {
    const all=[];
    allPlannedRecipes.forEach(r=>{ if(ingredients[r.id]) ingredients[r.id].forEach(ing=>{ all.push(ing.replace(/^\d+[\d.,]*\s*(g|kg|dl|l|ml|stk|ss|ts|neve|klype|fedd|skive)?\s*/i,"").trim()); }); });
    return all;
  };

  const openOda = () => {
    const items = buildOdaSearch();
    if (!items.length) { notify("Hent ingredienser først!","warn"); return; }
    window.open(`https://oda.com/no/search/?q=${encodeURIComponent(items[0])}`,"_blank");
    notify(`Åpner Oda med "${items[0]}"`);
  };

  const filteredRecipes = recipes
    .filter(r=>r.name.toLowerCase().includes(searchQuery.toLowerCase()))
    .filter(r=>starFilter===0||(r.rating||0)>=starFilter)
    .filter(r=>tagFilter.length===0||tagFilter.every(t=>(r.tags||[]).includes(t)))
    .sort((a,b)=>(b.rating||0)-(a.rating||0));

  const plannedCount = allPlannedRecipes.length;

  // ── Loading screen ──
  if (loading) return (
    <div style={{minHeight:"100vh",background:"#faf6f0",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:20}}>
      <div style={{fontSize:48}}>🍽</div>
      <Spinner/>
      <p style={{fontFamily:"sans-serif",color:"#a08060",fontSize:14}}>Laster middagsplanleggeren…</p>
    </div>
  );

  // ── Main render ──
  return (
    <div style={{minHeight:"100vh",background:"#faf6f0",fontFamily:"Georgia,'Times New Roman',serif",color:"#2c1a0e"}}>

      {/* HEADER */}
      <header style={{background:"linear-gradient(135deg,#2c1a0e 0%,#5c3317 100%)",position:"sticky",top:0,zIndex:100,boxShadow:"0 4px 20px rgba(44,26,14,0.3)"}}>
        <div style={{maxWidth:780,margin:"0 auto",padding:"0 20px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"16px 0 8px"}}>
            <div>
              <h1 style={{margin:0,fontSize:26,color:"#f5e6c8",fontWeight:"normal"}}>🍽 Middagsplanleggeren</h1>
              <p style={{margin:"2px 0 0",fontSize:12,color:"#c4a882",letterSpacing:"0.1em",textTransform:"uppercase"}}>Din ukentlige matliste</p>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              {syncing && <Spinner/>}
              {plannedCount>0&&<div style={{background:"#e8a030",color:"#2c1a0e",borderRadius:20,padding:"4px 12px",fontSize:13,fontFamily:"sans-serif",fontWeight:600}}>{plannedCount}/7 dager planlagt</div>}
            </div>
          </div>
          <nav style={{display:"flex",borderTop:"1px solid rgba(255,255,255,0.1)"}}>
            {[{id:"plan",label:"📅 Ukesplan"},{id:"recipes",label:"📖 Oppskrifter"},{id:"list",label:"🛒 Handleliste"},{id:"history",label:"📚 Historikk"}].map(tab=>(
              <button key={tab.id} onClick={()=>setView(tab.id)} style={{background:view===tab.id?"rgba(232,160,48,0.2)":"transparent",border:"none",borderBottom:view===tab.id?"3px solid #e8a030":"3px solid transparent",color:view===tab.id?"#f5e6c8":"#a08060",padding:"10px 14px",fontSize:13,cursor:"pointer",fontFamily:"sans-serif",fontWeight:view===tab.id?600:400}}>{tab.label}</button>
            ))}
          </nav>
        </div>
      </header>

      {/* NOTIFICATION */}
      {notification&&<div style={{position:"fixed",top:90,left:"50%",transform:"translateX(-50%)",background:notification.type==="warn"?"#c0392b":"#27ae60",color:"white",padding:"10px 24px",borderRadius:30,zIndex:999,fontFamily:"sans-serif",fontSize:14,boxShadow:"0 4px 20px rgba(0,0,0,0.2)",animation:"fadeIn 0.3s ease",whiteSpace:"nowrap"}}>{notification.msg}</div>}

      <main style={{maxWidth:780,margin:"0 auto",padding:"24px 20px"}}>

        {/* ── UKESPLAN ── */}
        {view==="plan"&&(
          <div>
            <div style={{display:"grid",gap:12}}>
              {DAYS.map(day=>{
                const recipe=plan[day];
                const isWeekend=day==="Lørdag"||day==="Søndag";
                return (
                  <div key={day} style={{background:"white",borderRadius:16,padding:"16px 20px",boxShadow:"0 2px 12px rgba(44,26,14,0.08)",border:isWeekend?"1px solid #e8d5b0":"1px solid #f0e8dc",display:"flex",alignItems:"center",gap:16}}>
                    <div style={{minWidth:90}}>
                      <div style={{fontSize:15,color:isWeekend?"#8b5e3c":"#2c1a0e"}}>{day}</div>
                      {isWeekend&&<div style={{fontSize:10,color:"#c4a882",fontFamily:"sans-serif",textTransform:"uppercase",letterSpacing:"0.08em"}}>helg</div>}
                    </div>
                    {recipe ? (
                      <div style={{flex:1,display:"flex",alignItems:"center",gap:12}}>
                        <div style={{flex:1}}>
                          <div style={{fontSize:15,color:"#2c1a0e",marginBottom:4}}>{recipe.name}</div>
                          <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                            {recipe.rating>0&&<StarRating rating={recipe.rating} readonly size={14}/>}
                            <TagBadges tags={recipe.tags} size="small"/>
                          </div>
                        </div>
                        <div style={{display:"flex",gap:8}}>
                          {recipe.url&&<a href={recipe.url} target="_blank" rel="noopener noreferrer" style={{background:"#f5e6c8",borderRadius:8,padding:"6px 12px",fontSize:12,color:"#5c3317",textDecoration:"none",fontFamily:"sans-serif"}}>Oppskrift ↗</a>}
                          <button onClick={()=>clearDay(day)} style={{background:"#fde8e8",border:"none",borderRadius:8,padding:"6px 10px",fontSize:13,cursor:"pointer",color:"#c0392b"}}>✕</button>
                        </div>
                      </div>
                    ) : (
                      <button onClick={()=>setShowAssign(day)} style={{flex:1,background:"#faf6f0",border:"2px dashed #d4c4a8",borderRadius:10,padding:"10px 16px",fontSize:14,color:"#a08060",cursor:"pointer",textAlign:"left",fontFamily:"Georgia,serif"}}>+ Velg middag for {day.toLowerCase()}</button>
                    )}
                  </div>
                );
              })}
            </div>
            {plannedCount===0&&<div style={{textAlign:"center",padding:"40px 20px",color:"#a08060",fontFamily:"sans-serif",fontSize:14}}><div style={{fontSize:40,marginBottom:12}}>🥘</div><p>Klikk på en dag for å planlegge middag!<br/>Legg først til oppskrifter under «Oppskrifter».</p></div>}
          </div>
        )}

        {/* ── OPPSKRIFTER ── */}
        {view==="recipes"&&(
          <div>
            <div style={{display:"flex",gap:10,marginBottom:12}}>
              <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder="Søk i oppskrifter..." style={{...inputStyle,flex:1,border:"2px solid #e0d4c0"}}/>
              <button onClick={()=>setShowAddRecipe(true)} style={{background:"linear-gradient(135deg,#5c3317,#8b5e3c)",color:"white",border:"none",borderRadius:10,padding:"10px 20px",fontSize:14,cursor:"pointer",fontFamily:"sans-serif",fontWeight:600,whiteSpace:"nowrap"}}>+ Legg til</button>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,flexWrap:"wrap"}}>
              <span style={{fontFamily:"sans-serif",fontSize:12,color:"#a08060",whiteSpace:"nowrap"}}>Vis min.</span>
              {[0,1,2,3,4,5].map(n=>(
                <button key={n} onClick={()=>setStarFilter(n)} style={{background:starFilter===n?"#2c1a0e":"white",color:starFilter===n?"#f5e6c8":"#5c3317",border:"2px solid "+(starFilter===n?"#2c1a0e":"#e0d4c0"),borderRadius:20,padding:"4px 12px",fontSize:13,cursor:"pointer",fontFamily:"sans-serif"}}>{n===0?"Alle":"★".repeat(n)}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
              <button onClick={()=>setTagFilter([])} style={{background:tagFilter.length===0?"#2c1a0e":"white",color:tagFilter.length===0?"#f5e6c8":"#5c3317",border:"2px solid "+(tagFilter.length===0?"#2c1a0e":"#e0d4c0"),borderRadius:20,padding:"5px 14px",fontSize:13,cursor:"pointer",fontFamily:"sans-serif"}}>Alle</button>
              {CATEGORIES.map(cat=>{const active=tagFilter.includes(cat.id);return(
                <button key={cat.id} onClick={()=>setTagFilter(prev=>active?prev.filter(t=>t!==cat.id):[...prev,cat.id])} style={{background:active?cat.color:"white",color:active?cat.text:"#5c3317",border:"2px solid "+(active?cat.color:"#e0d4c0"),borderRadius:20,padding:"5px 14px",fontSize:13,cursor:"pointer",fontFamily:"sans-serif",fontWeight:active?600:400}}>{cat.emoji} {cat.label}</button>
              );})}
            </div>

            {showAddRecipe&&(
              <div style={{background:"white",borderRadius:16,padding:20,marginBottom:20,boxShadow:"0 4px 24px rgba(44,26,14,0.12)",border:"1px solid #e8d5b0"}}>
                <h3 style={{margin:"0 0 16px",fontSize:18,fontWeight:"normal"}}>Ny oppskrift</h3>
                <div style={{display:"flex",flexDirection:"column",gap:10}}>
                  <input value={newRecipe.name} onChange={e=>setNewRecipe(p=>({...p,name:e.target.value}))} placeholder="Navn på oppskrift *" style={inputStyle}/>
                  <input value={newRecipe.url} onChange={e=>setNewRecipe(p=>({...p,url:e.target.value}))} placeholder="Lenke til oppskrift" style={inputStyle}/>
                  <div>
                    <div style={{fontFamily:"sans-serif",fontSize:12,color:"#a08060",marginBottom:8}}>Tags (velg gjerne flere)</div>
                    <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                      {CATEGORIES.map(cat=>{const active=newRecipe.tags.includes(cat.id);return(
                        <button key={cat.id} type="button" onClick={()=>setNewRecipe(p=>({...p,tags:active?p.tags.filter(t=>t!==cat.id):[...p.tags,cat.id]}))} style={{background:active?cat.color:"white",color:active?cat.text:"#5c3317",border:"2px solid "+(active?cat.color:"#e0d4c0"),borderRadius:20,padding:"6px 14px",fontSize:13,cursor:"pointer",fontFamily:"sans-serif",fontWeight:active?600:400}}>{cat.emoji} {cat.label}</button>
                      );})}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:10}}>
                    <button onClick={addRecipe} style={{background:"#5c3317",color:"white",border:"none",borderRadius:8,padding:"10px 20px",fontSize:14,cursor:"pointer",fontFamily:"sans-serif"}}>Lagre</button>
                    <button onClick={()=>setShowAddRecipe(false)} style={{background:"#f0e8dc",color:"#5c3317",border:"none",borderRadius:8,padding:"10px 20px",fontSize:14,cursor:"pointer",fontFamily:"sans-serif"}}>Avbryt</button>
                  </div>
                </div>
              </div>
            )}

            <div style={{display:"grid",gap:12}}>
              {filteredRecipes.map(recipe=>(
                <div key={recipe.id} style={{background:"white",borderRadius:14,padding:"16px 20px",boxShadow:"0 2px 10px rgba(44,26,14,0.07)",border:"1px solid #f0e8dc",display:"flex",alignItems:"flex-start",gap:16}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:16,marginBottom:4,color:"#2c1a0e"}}>{recipe.name}</div>
                    {recipe.url&&<a href={recipe.url} target="_blank" rel="noopener noreferrer" style={{fontSize:12,color:"#8b5e3c",textDecoration:"none",fontFamily:"sans-serif",display:"block",marginBottom:6}}>🔗 {recipe.url.replace(/^https?:\/\//,"").split("/")[0]}</a>}
                    <div style={{marginBottom:8}}><StarRating rating={recipe.rating||0} onChange={val=>rateRecipe(recipe.id,val)} size={18}/></div>
                    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                      {CATEGORIES.map(cat=>{const active=(recipe.tags||[]).includes(cat.id);return(
                        <button key={cat.id} onClick={()=>toggleTag(recipe.id,cat.id)} style={{background:active?cat.color:"#f5f2ee",color:active?cat.text:"#a08060",border:"2px solid "+(active?cat.color:"transparent"),borderRadius:20,padding:"3px 10px",fontSize:12,fontFamily:"sans-serif",fontWeight:active?600:400,cursor:"pointer",opacity:active?1:0.6}}>{cat.emoji} {cat.label}</button>
                      );})}
                    </div>
                  </div>
                  <button onClick={()=>deleteRecipe(recipe.id)} style={{background:"none",border:"none",fontSize:18,cursor:"pointer",color:"#c4a882",padding:4,lineHeight:1}}>✕</button>
                </div>
              ))}
              {filteredRecipes.length===0&&<div style={{textAlign:"center",padding:40,color:"#a08060",fontFamily:"sans-serif"}}>{searchQuery||starFilter||tagFilter.length?"Ingen oppskrifter matcher filteret":"Ingen oppskrifter ennå — legg til din første!"}</div>}
            </div>
          </div>
        )}

        {/* ── HANDLELISTE ── */}
        {view==="list"&&(
          <div>
            {allPlannedRecipes.length===0?(
              <div style={{textAlign:"center",padding:"60px 20px",color:"#a08060",fontFamily:"sans-serif"}}>
                <div style={{fontSize:40,marginBottom:12}}>🛒</div>
                <p>Planlegg ukens middager først!</p>
                <button onClick={()=>setView("plan")} style={{background:"#5c3317",color:"white",border:"none",borderRadius:10,padding:"10px 24px",fontSize:14,cursor:"pointer",fontFamily:"sans-serif",marginTop:8}}>Gå til ukesplan</button>
              </div>
            ):(
              <div>
                <div style={{background:"white",borderRadius:14,padding:"16px 20px",marginBottom:20,border:"1px solid #f0e8dc"}}>
                  <h3 style={{margin:"0 0 10px",fontSize:16,fontWeight:"normal",color:"#5c3317"}}>Denne ukens middager ({plannedCount} dager)</h3>
                  <div style={{display:"flex",flexDirection:"column",gap:6}}>{DAYS.map(day=>plan[day]&&(<div key={day} style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontFamily:"sans-serif",fontSize:13,color:"#a08060"}}>{day}</span><span style={{fontSize:14}}>{plan[day].name}</span></div>))}</div>
                </div>
                <div style={{marginBottom:20}}>
                  <h3 style={{margin:"0 0 12px",fontSize:16,fontWeight:"normal",color:"#5c3317"}}>Ingredienser (AI-generert)</h3>
                  {allPlannedRecipes.map(recipe=>(
                    <div key={recipe.id} style={{background:"white",borderRadius:12,padding:"14px 18px",marginBottom:10,border:"1px solid #f0e8dc"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                        <div style={{fontSize:15}}>{recipe.name}</div>
                        {!ingredients[recipe.id]&&<button onClick={()=>fetchIngredients(recipe.id,recipe.url||recipe.name)} disabled={loadingIngr===recipe.id} style={{background:loadingIngr===recipe.id?"#e0d4c0":"#5c3317",color:"white",border:"none",borderRadius:8,padding:"6px 14px",fontSize:12,cursor:loadingIngr===recipe.id?"wait":"pointer",fontFamily:"sans-serif"}}>{loadingIngr===recipe.id?"Henter…":"Hent ingredienser"}</button>}
                      </div>
                      {ingredients[recipe.id]&&<ul style={{margin:0,padding:"0 0 0 18px"}}>{ingredients[recipe.id].map((ing,i)=><li key={i} style={{fontFamily:"sans-serif",fontSize:13,color:"#3c2010",marginBottom:3}}>{ing}</li>)}</ul>}
                    </div>
                  ))}
                </div>
                <div style={{background:"linear-gradient(135deg,#1a5c2c,#2e8b57)",borderRadius:16,padding:"24px",textAlign:"center",color:"white"}}>
                  <div style={{fontSize:28,marginBottom:8}}>🛒</div>
                  <h3 style={{margin:"0 0 6px",fontWeight:"normal",fontSize:20}}>Handle på Oda</h3>
                  <p style={{margin:"0 0 16px",fontFamily:"sans-serif",fontSize:13,opacity:0.85}}>Hent ingredienser ovenfor, så åpner vi Oda med første søk.</p>
                  <button onClick={openOda} style={{background:"white",color:"#1a5c2c",border:"none",borderRadius:10,padding:"12px 28px",fontSize:16,cursor:"pointer",fontFamily:"sans-serif",fontWeight:700}}>Åpne Oda.com →</button>
                  {buildOdaSearch().length>0&&(
                    <div style={{marginTop:20,background:"rgba(255,255,255,0.15)",borderRadius:10,padding:"12px 16px",textAlign:"left"}}>
                      <div style={{fontFamily:"sans-serif",fontSize:12,marginBottom:8,opacity:0.9}}>📋 Din handleliste:</div>
                      <div style={{fontFamily:"monospace",fontSize:12,lineHeight:1.6}}>{buildOdaSearch().map((item,i)=><div key={i} style={{opacity:0.9}}>• {item}</div>)}</div>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── HISTORIKK ── */}
        {view==="history"&&(()=>{
          const years = Object.keys(history).map(Number).sort((a,b)=>b-a);
          const activeYear = expandedYear ?? (years[0]||currentYear);
          const hasAnyHistory = years.some(y=>Object.keys(history[String(y)]||{}).length>0);
          return (
            <div>
              <div style={{background:"white",borderRadius:14,padding:"16px 20px",marginBottom:20,border:"1px solid #f0e8dc",display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,flexWrap:"wrap"}}>
                <div>
                  <div style={{fontSize:15,marginBottom:2}}>Uke {currentWeek}, {currentYear}</div>
                  <div style={{fontFamily:"sans-serif",fontSize:12,color:"#a08060"}}>{allPlannedRecipes.length} av 7 dager planlagt denne uken</div>
                </div>
                <button onClick={()=>archiveWeek(currentWeek,currentYear,{...plan})} disabled={allPlannedRecipes.length===0||syncing} style={{background:allPlannedRecipes.length===0?"#e0d4c0":"linear-gradient(135deg,#5c3317,#8b5e3c)",color:allPlannedRecipes.length===0?"#a08060":"white",border:"none",borderRadius:10,padding:"10px 20px",fontSize:14,cursor:allPlannedRecipes.length===0?"not-allowed":"pointer",fontFamily:"sans-serif",fontWeight:600,whiteSpace:"nowrap"}}>📥 Arkiver denne uken</button>
              </div>
              {!hasAnyHistory&&<div style={{textAlign:"center",padding:"50px 20px",color:"#a08060",fontFamily:"sans-serif"}}><div style={{fontSize:36,marginBottom:12}}>📚</div><p>Ingen arkiverte uker ennå.<br/>Planlegg uken og trykk «Arkiver denne uken».</p></div>}
              {years.map(year=>{
                const yearEntries=history[String(year)]||{};
                const weeks=Object.values(yearEntries).sort((a,b)=>b.week-a.week);
                if(!weeks.length) return null;
                const isOpen=activeYear===year;
                return (
                  <div key={year} style={{marginBottom:12}}>
                    <button onClick={()=>setExpandedYear(isOpen?null:year)} style={{width:"100%",background:isOpen?"#2c1a0e":"white",color:isOpen?"#f5e6c8":"#2c1a0e",border:"1px solid "+(isOpen?"#2c1a0e":"#e0d4c0"),borderRadius:isOpen?"14px 14px 0 0":14,padding:"14px 20px",fontSize:16,cursor:"pointer",fontFamily:"Georgia,serif",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <span>{year}</span>
                      <span style={{fontFamily:"sans-serif",fontSize:13,opacity:0.7}}>{weeks.length} uke{weeks.length!==1?"r":""} {isOpen?"▲":"▼"}</span>
                    </button>
                    {isOpen&&(
                      <div style={{background:"white",border:"1px solid #e0d4c0",borderTop:"none",borderRadius:"0 0 14px 14px",overflow:"hidden"}}>
                        {weeks.map((entry,i)=>{
                          const key=`${entry.year}-W${String(entry.week).padStart(2,"0")}`;
                          const plannedDays=DAYS.filter(d=>entry.plan[d]);
                          return (
                            <div key={key} style={{borderTop:i>0?"1px solid #f0e8dc":"none",padding:"14px 20px"}}>
                              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                                <div><span style={{fontSize:15}}>Uke {entry.week}</span><span style={{fontFamily:"sans-serif",fontSize:11,color:"#a08060",marginLeft:10}}>{plannedDays.length} dager planlagt</span></div>
                                <button onClick={()=>deleteHistoryEntry(year,key)} style={{background:"none",border:"none",fontSize:16,cursor:"pointer",color:"#c4a882",padding:4}}>✕</button>
                              </div>
                              <div style={{display:"flex",flexDirection:"column",gap:5}}>
                                {DAYS.map(day=>{
                                  const r=entry.plan[day];
                                  if(!r) return null;
                                  const tags=(r.tags||[]).map(tid=>CATEGORIES.find(c=>c.id===tid)).filter(Boolean);
                                  return (
                                    <div key={day} style={{display:"flex",alignItems:"center",gap:10,padding:"6px 10px",background:"#faf6f0",borderRadius:8}}>
                                      <span style={{fontFamily:"sans-serif",fontSize:11,color:"#a08060",minWidth:70}}>{day}</span>
                                      <span style={{fontSize:13,flex:1}}>{r.url?<a href={r.url} target="_blank" rel="noopener noreferrer" style={{color:"#2c1a0e",textDecoration:"none"}}>{r.name}</a>:r.name}</span>
                                      <div style={{display:"flex",gap:4,flexWrap:"wrap",alignItems:"center"}}>
                                        {tags.map(cat=><span key={cat.id} style={{background:cat.color,color:cat.text,borderRadius:8,padding:"1px 7px",fontSize:10,fontFamily:"sans-serif",fontWeight:600}}>{cat.emoji}</span>)}
                                        {r.rating>0&&<span style={{fontSize:11,color:"#e8a030"}}>{"★".repeat(r.rating)}</span>}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          );
        })()}

      </main>

      {/* ASSIGN MODAL */}
      {showAssign&&(
        <div style={{position:"fixed",inset:0,background:"rgba(44,26,14,0.5)",zIndex:200,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={()=>setShowAssign(null)}>
          <div style={{background:"#faf6f0",borderRadius:"20px 20px 0 0",padding:"24px 20px 32px",width:"100%",maxWidth:600,maxHeight:"70vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{margin:0,fontWeight:"normal",fontSize:20}}>Velg middag for {showAssign}</h3>
              <button onClick={()=>setShowAssign(null)} style={{background:"none",border:"none",fontSize:22,cursor:"pointer",color:"#a08060"}}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {recipes.length===0&&<p style={{color:"#a08060",fontFamily:"sans-serif",textAlign:"center"}}>Ingen oppskrifter ennå.</p>}
              {recipes.slice().sort((a,b)=>(b.rating||0)-(a.rating||0)).map(recipe=>(
                <button key={recipe.id} onClick={()=>assignRecipe(showAssign,recipe)} style={{background:"white",border:"2px solid #e0d4c0",borderRadius:12,padding:"14px 18px",textAlign:"left",cursor:"pointer",fontFamily:"Georgia,serif",fontSize:15,color:"#2c1a0e"}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
                    <span>{recipe.name}</span>
                    {recipe.rating>0&&<StarRating rating={recipe.rating} readonly size={14}/>}
                  </div>
                  {(recipe.tags||[]).length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}><TagBadges tags={recipe.tags} size="small"/></div>}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
